[build]
  command = "node build-site.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Consolidate every attached domain on the primary SEO host.
[[redirects]]
  from = "https://leadslinked.com/*"
  to = "https://olegcherkas.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://linkeolhq.com/*"
  to = "https://olegcherkas.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://linkeolteam.com/*"
  to = "https://olegcherkas.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://lucky-creponne-06d09d.netlify.app/*"
  to = "https://olegcherkas.com/:splat"
  status = 301
  force = true

# The case study URL said 50 meetings while the article reports 200.
[[redirects]]
  from = "/insights/from-cold-profile-to-50-enterprise-meetings-a-linkedin-growth-case-study"
  to = "/insights/from-cold-profile-to-200-enterprise-meetings-a-linkedin-growth-case-study/"
  status = 301

[[redirects]]
  from = "/insights/from-cold-profile-to-50-enterprise-meetings-a-linkedin-growth-case-study/"
